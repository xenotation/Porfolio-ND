[sitemap]
  filename = "sitemap.xml"
  enableRobotsTXT = true
  changeFreq = "daily"
  image = true

[markup]
  defaultMarkdownHandler = 'goldmark'

[taxonomies]
  category = "categories"

[minify]
  disableXML = true

[markup.goldmark]
  [markup.goldmark.renderer]
    unsafe = true

[languages]
  [languages.en]
    languageName = "English"
    languageCode = "en-US"
    disabled = false
    title = "Nikola Stoyanov"
    weight = "1"
    [languages.en.params]
      Description = "Nikola Stoyanov is a Bulgarian research-based artist, writer and translator based in Sofia. Working across installation, moving image, archives, networked media and technological apparatuses, his practice examines how paranoia, propaganda, extraction and technological mediation shape perception, with a recurring focus on post-socialist and post-Soviet histories and their contemporary afterlives."
      name = "Nikola Stoyanov"
      alternateNames = ["Никола Стоянов", "Nikola Vladislavov Stoyanov", "Никола Владиславов Стоянов"]
      jobTitle = ["Artist", "philosopher", "translator"]
      profileImage = "images/profile.jpg"
      organizerUrl = "https://newdegeneration.xyz/about/"

  [languages.bg]
    languageName = "Български"
    languageCode = "bg-BG"
    disabled = false
    weight = "2"
    title = "Никола Стоянов"
    [languages.bg.params]
      Description = "Никола Стоянов е български художник, писател и преводач, работещ в областта на изследователската дейност, който е базиран в София. Работейки с инсталации, видео, архиви, мрежови медии и технологични устройства, неговата практика изследва как параноята, пропагандата, експлоатацията и технологичната медиация оформят възприятието, с конкретен интерес в постсоциалистическите и постсъветските истории и тяхните съвременни последствия."
      name = "Никола Стоянов"
      alternateNames = ["Nikola Stoyanov", "Nikola Vladislavov Stoyanov", "Никола Владиславов Стоянов"]
      jobTitle = ["Aртист", "философ", "преводач"]
      profileImage = "images/profile.jpg"
      organizerUrl = "https://newdegeneration.xyz/bg/about/"

 