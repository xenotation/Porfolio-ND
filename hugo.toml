baseURL = "https://newdegeneration.xyz/"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[params]
  params_sameas_other = [
    "https://twitter.com/new_degen",
    "https://www.youtube.com/@newdegeneration",
    "https://www.wikidata.org/wiki/Q124417026",
    "https://orcid.org/0009-0004-6022-3086",
    "https://www.goodreads.com/author/show/48653203",
    "https://www.imdb.com/name/nm16814810",
    "https://sussex.academia.edu/NikolaStoyanov"
  ]

[params.documents.portfolio_pdf]
en = "/portfolio-en.pdf"
bg = "/portfolio-bg.pdf"

[params.documents.cv_pdf]
en = "/cv-en.pdf"
bg = "/cv-bg.pdf"

[params.social]
    email     = "mailto:av0id.biz@gmail.com"
    instagram = "https://www.instagram.com/avoid.nd/"
    facebook  = "https://www.facebook.com/av0id.nd/"
    youtube   = "https://www.youtube.com/@newdegeneration"

[sitemap]
  filename = "sitemap.xml"
  enableRobotsTXT = true
  changeFreq = "daily"
  image = true

[markup]
  defaultMarkdownHandler = 'goldmark'

[taxonomies]
  category = "categories"

[minify]
  disableXML = true

[markup.goldmark]
  [markup.goldmark.renderer]
    unsafe = true

[languages]
  [languages.en]
    languageName = "English"
    languageCode = "en-US"
    disabled = false
    title = "Nikola Stoyanov"
    weight = "1"
    [languages.en.params]
      Description = "Nikola Stoyanov is a Bulgarian research-based visual artist, writer, philosopher and translator based in Sofia. Working across installation, moving image, archives and networked media, his practice examines paranoia, propaganda and technological mediation."
      name = "Nikola Stoyanov"
      alternateNames = ["Никола Стоянов", "Nikola Vladislavov Stoyanov", "Никола Владиславов Стоянов"]
      jobTitle = ["Visual artist", "writer", "philosopher", "translator"]
      profileImage = "images/profile.jpg"
      organizerUrl = "https://newdegeneration.xyz/about/"

  [languages.bg]
    languageName = "Български"
    languageCode = "bg-BG"
    disabled = false
    weight = "2"
    title = "Никола Стоянов"
    [languages.bg.params]
      Description = "Никола Стоянов е български визуален артист, писател, философ и преводач, базиран в София. Работи с инсталации, движещ се образ, архиви и мрежови медии и изследва параноята, пропагандата и технологичната медиация."
      name = "Никола Стоянов"
      alternateNames = ["Nikola Stoyanov", "Nikola Vladislavov Stoyanov", "Никола Владиславов Стоянов"]
      jobTitle = ["визуален артист", "писател", "философ", "преводач"]
      profileImage = "images/profile.jpg"
      organizerUrl = "https://newdegeneration.xyz/bg/about/"
